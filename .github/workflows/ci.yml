name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"

env:
  # Los scripts del método emiten SIEMPRE UTF-8 (embudo de salida); la suite debe
  # decodificar igual también en Windows, donde el default sería cp1252.
  PYTHONUTF8: "1"

jobs:
  tests:
    name: Tests (${{ matrix.os }} · py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Identidad git del runner (los tests montan repos reales)
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@invalid.local"
        shell: bash
      - name: Suite del visor y del método
        run: python3 -m unittest discover -s visor/tests -p "test_*.py" -v
        shell: bash
      - name: Suite del visor de contratos
        run: python3 -m unittest discover -s visor_contratos/tests -p "test_*.py" -v
        shell: bash
      - name: Validación del ejemplo del visor
        run: python3 visor/validar.py --datos visor/ejemplo.json
        shell: bash

  nightly:
    name: Adversarial (nightly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 -m unittest discover -s visor/tests/nightly -p "test_*.py" -v
